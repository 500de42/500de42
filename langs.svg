<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Top 5 languages</title>
  <desc id="desc">A local SVG donut chart showing five main languages used in the profile README.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(235 230)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="92" fill="none" stroke="#1f2937" stroke-width="54"/>
    <g fill="none" stroke-linecap="butt" stroke-width="54">
      <circle cx="0" cy="0" r="92" stroke="#7A4A9E" stroke-dasharray="368 578" stroke-dashoffset="0" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="92" stroke="#9D00FF" stroke-dasharray="157 578" stroke-dashoffset="-368" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="92" stroke="#06b6d4" stroke-dasharray="33 578" stroke-dashoffset="-525" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="92" stroke="#f59e0b" stroke-dasharray="14 578" stroke-dashoffset="-558" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="92" stroke="#6b7280" stroke-dasharray="6 578" stroke-dashoffset="-572" transform="rotate(-90)"/>
    </g>
    <circle cx="0" cy="0" r="54" fill="transparent"/>
    <text x="0" y="-6" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Top 5</text>
    <text x="0" y="18" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">languages</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(455 142)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#7A4A9E"/>
      <text x="28" y="13" fill="#e2e8f0">C - 63.62%</text>
    </g>
    <g transform="translate(455 184)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#9D00FF"/>
      <text x="28" y="13" fill="#e2e8f0">C++ - 27.15%</text>
    </g>
    <g transform="translate(455 226)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#06b6d4"/>
      <text x="28" y="13" fill="#e2e8f0">TypeScript - 5.81%</text>
    </g>
    <g transform="translate(455 268)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#f59e0b"/>
      <text x="28" y="13" fill="#e2e8f0">Makefile - 2.42%</text>
    </g>
    <g transform="translate(455 310)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#6b7280"/>
      <text x="28" y="13" fill="#e2e8f0">Shell - 1%</text>
    </g>
  </g>
</svg>
